  ST.nf.sub=ST.nf.months*s.fee;draw();toast("تم حفظ إعدادات الإدارة")},
 avatar(t){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ST.user.img=r.result;draw();toast("تم تحديث الصورة")};r.readAsDataURL(f)},
 msgsave(){ST.msgs=[0,1,2,3].map(i=>val("m"+i));toast("تم حفظ رسائل التذكير")},
 stg(t){ST.stg=+t.value;draw()},
 mepw(){const p=val("npw");if(p.length<4){toast("كلمة المرور قصيرة (4 أحرف على الأقل)");return}ST.user.p=p;draw();toast("تم تغيير كلمة المرور")}
};
document.addEventListener("click",e=>{const lk=e.target.closest('a[href^="#"]');if(!lk||ST.view!="site")return;const id=lk.getAttribute("href").slice(1),tb=TABOF[id];if(!tb)return;e.preventDefault();ST.st=tb;draw();const el=document.getElementById(id);if(el&&id!=tb)el.scrollIntoView();else scrollTo(0,0)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName=="FORM")return;const f=H[t.dataset.a];if(f){if(t.tagName=="A"||t.type=="submit")e.preventDefault();f(t)}});
document.addEventListener("submit",e=>{const t=e.target.closest("[data-a]");if(t&&H[t.dataset.a]){e.preventDefault();H[t.dataset.a](t)}});
document.addEventListener("change",e=>{const t=e.target.closest("[data-ch]");if(t&&H[t.dataset.ch])H[t.dataset.ch](t)});
draw();
</script>
</body>
</html>
